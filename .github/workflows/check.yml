name: Verify
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm ci --prefix functions
      - run: npm run build
      - name: Bundle Cloudflare Workers Free API (no deployment or billing)
        run: npx --yes wrangler@4.129.1 deploy --dry-run --outdir /tmp/choice-arena-worker
      - run: npm run test:unit
      - run: npm run test:rules
      - name: Prepare browser
        timeout-minutes: 5
        run: |
          if command -v google-chrome >/dev/null 2>&1; then
            browser_path="$(command -v google-chrome)"
            echo "PLAYWRIGHT_CHROMIUM_EXECUTABLE=$browser_path" >> "$GITHUB_ENV"
            "$browser_path" --version
          else
            npx playwright install --with-deps chromium
          fi
      - run: npm run test:ui
      - run: npm run test:auth
      - run: npm run test:game
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: test-results/
          retention-days: 7
